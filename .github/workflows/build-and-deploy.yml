name: Build and deploy (Jekyll + Dart Sass -> gh-pages)

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write    # required so the GITHUB_TOKEN can push the gh-pages branch
  id-token: write

concurrency:
  group: "pages-deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    outputs:
      site_path: _site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dart Sass (npm "sass")
        run: npm install -g sass

      - name: Compile SCSS with Dart Sass
        run: |
          if [ -f assets/css/main.scss ]; then \
            sass --load-path=_sass assets/css/main.scss:assets/css/main.css --no-source-map; \
            mv assets/css/main.scss assets/css/main.scss.bak || true; \
            if [ -d _sass ]; then mv _sass _sass.bak || true; fi; \
          else \
            echo "No assets/css/main.scss found — skipping dart-sass compile"; \
          fi

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install dependencies
        run: |
          gem install bundler --no-document
          bundle config set path .bundle
          bundle install --jobs 4 --retry 3

      - name: Build the Jekyll site
        run: bundle exec jekyll build --destination _site
        env:
          JEKYLL_ENV: production

  deploy:
    name: Deploy to gh-pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./_site
          publish_branch: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
